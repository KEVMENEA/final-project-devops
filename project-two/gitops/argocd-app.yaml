apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-final-react
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/KEVMENEA/final-project-devops.git
    targetRevision: main
    path: project-two/gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
