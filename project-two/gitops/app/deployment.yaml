apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-final-react
  namespace: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-final-react
  template:
    metadata:
      labels:
        app: devops-final-react
    spec:
      containers:
        - name: react-app
          image: ghcr.io/kevmenea/devops-final-react:7f81ba74749af7a9d538353baedafeb5a3540c3e
          imagePullPolicy: Always
          ports:
            - containerPort: 80
