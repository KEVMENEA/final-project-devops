apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-final-react
  namespace: devops-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.meneakevit.store
      secretName: devops-app-tls
  rules:
    - host: app.meneakevit.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-final-react
                port:
                  number: 80
