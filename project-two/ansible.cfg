[defaults]
inventory = inventories/production/hosts.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --project=cs-project-huenwcu3 --zone=asia-southeast2-b --verbosity=warning"
