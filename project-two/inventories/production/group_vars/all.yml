---
# GCP
gcp_project: cs-project-huenwcu3
gcp_region: asia-southeast2
gcp_zone: asia-southeast2-b

# Network
gcp_network: k8s-network
gcp_subnet: k8s-subnet
gcp_subnet_cidr: 10.20.0.0/24

# OS
gcp_image_project: ubuntu-os-cloud
gcp_image_family: ubuntu-2404-lts-amd64

# Control Plane + etcd
control_planes:
  - name: k8s-cp01
    ip: 10.20.0.11
    machine_type: e2-medium
  - name: k8s-cp02
    ip: 10.20.0.12
    machine_type: e2-medium
  - name: k8s-cp03
    ip: 10.20.0.13
    machine_type: e2-medium

# Workers
workers:
  - name: k8s-worker01
    ip: 10.20.0.21
    machine_type: e2-standard-2
  - name: k8s-worker02
    ip: 10.20.0.22
    machine_type: e2-standard-2
  - name: k8s-worker03
    ip: 10.20.0.23
    machine_type: e2-standard-2

# Domains
base_domain: meneakevit.store
headlamp_domain: headlamp.meneakevit.store
argocd_domain: argocd.meneakevit.store
app_domain: app.meneakevit.store
