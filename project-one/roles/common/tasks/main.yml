---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - tree
      - unzip
      - vim
      - htop
      - ca-certificates
      - gnupg
      - zsh
    state: present

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
