name: React CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'project-two/app/**'
      - '.github/workflows/react-ci.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./project-two/app
          push: true
          tags: |
            ghcr.io/kevmenea/devops-final-react:${{ github.sha }}
            ghcr.io/kevmenea/devops-final-react:latest

      - name: Update Kubernetes image tag
        run: |
          sed -i "s|image: ghcr.io/kevmenea/devops-final-react:.*|image: ghcr.io/kevmenea/devops-final-react:${GITHUB_SHA}|" \
            project-two/gitops/app/deployment.yaml

      - name: Commit GitOps manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add project-two/gitops/app/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "deploy: update React image to ${GITHUB_SHA} [skip ci]"
            git push
          fi
